name: Build Firmware

on:
  push:
    branches: [main, develop]
    paths:
      - 'firmware/**'
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build:
    name: Compile ESP-IDF Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create wifi_config.h from template
        run: cp firmware/config/wifi_config.h.template firmware/config/wifi_config.h

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.5
          target: esp32s3
          path: firmware
          command: idf.py build

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: CAREC_firmware
          path: |
            firmware/build/CAREC_firmware.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin

      - name: Attach binary to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: firmware/build/CAREC_firmware.bin
          asset_name: CAREC_firmware_${{ github.event.release.tag_name }}.bin
          asset_content_type: application/octet-stream

name: Build Firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.gitmodules'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compile ESP-IDF Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create wifi_config.h from template
        run: cp firmware/config/wifi_config.h.template firmware/config/wifi_config.h

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.5
          target: esp32s3
          path: firmware
          command: idf.py build

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: CAREC_firmware
          path: |
            firmware/build/CAREC_firmware.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin

name: Project Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Validate project status
        run: python3 scripts/validate_status.py

      - name: Validate requirements and safety traceability
        run: python3 scripts/validate_traceability.py

      - name: Check contributor bootstrap
        run: ./scripts/bootstrap.sh --check

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

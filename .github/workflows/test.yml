name: Run Tests

on:
  push:
    branches: [main]
    paths:
      - 'autonomy_ws/**'
      - 'simulation/**'
      - 'software/**'
      - 'tests/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Simulation and autonomy tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-json-report

      - name: Run current unit tests
        run: |
          pytest tests/unit -v \
            --json-report \
            --json-report-file=tests/results/ci_results.json

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/results/ci_results.json

name: Run Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'tests/**'
      - 'firmware/main/**'
      - 'firmware/config/**'
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-json-report

      - name: Run obstacle tests
        run: |
          pytest tests/obstacle_test.py -v \
            --json-report \
            --json-report-file=tests/results/ci_results.json

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/results/ci_results.json

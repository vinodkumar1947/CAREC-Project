name: Run Tests

on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'firmware/main/**'
      - 'firmware/config/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-json-report

      - name: Run obstacle tests
        run: |
          pytest tests/obstacle_test.py tests/unit -v \
            --json-report \
            --json-report-file=tests/results/ci_results.json

      - name: Compile and run portable safety decision test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ifirmware/main \
            tests/cpp/safety_decision_test.cpp \
            -o /tmp/carec_safety_decision_test
          /tmp/carec_safety_decision_test

      - name: Compile and run portable health supervisor test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ifirmware/main \
            tests/cpp/health_supervisor_test.cpp \
            -o /tmp/carec_health_supervisor_test
          /tmp/carec_health_supervisor_test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/results/ci_results.json

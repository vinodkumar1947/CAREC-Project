name: Feature
description: Propose a user or engineering capability
title: "[FEATURE] "
labels: ["type:feature"]
body:
  - type: dropdown
    id: status
    attributes: {label: Status, options: [Ready, Blocked, Needs triage]}
    validations: {required: true}
  - type: dropdown
    id: workstream
    attributes: {label: Track, options: [Architecture, Simulation, ROS2, Navigation, Vision, AI/ML, Sensor Fusion, Firmware, Hardware, Mobile, Cloud, Safety, Testing, Documentation, DevEx, Project Management, Other]}
    validations: {required: true}
  - type: dropdown
    id: complexity
    attributes: {label: Difficulty, options: [Good first issue, Beginner, Intermediate, Advanced]}
    validations: {required: true}
  - type: dropdown
    id: hardware
    attributes: {label: Hardware required, options: ["No", "Yes - owner/prototype hardware", "TBD"]}
    validations: {required: true}
  - type: textarea
    id: prerequisites
    attributes: {label: Prerequisites, description: "Setup, skills, documents, decisions, or previous work required. Write None if not applicable."}
    validations: {required: true}
  - type: textarea
    id: dependencies
    attributes: {label: Depends on, description: "Reference blocking issues/PRs/ADRs. Write None if unblocked."}
    validations: {required: true}
  - type: textarea
    id: summary
    attributes: {label: Outcome / Summary}
    validations: {required: true}
  - type: textarea
    id: motivation
    attributes: {label: Motivation, description: "Who benefits and what problem is solved?"}
    validations: {required: true}
  - type: textarea
    id: solution
    attributes: {label: Proposed solution}
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance criteria, description: "State measurable completion evidence.", placeholder: "- [ ] ..."}
    validations: {required: true}
  - type: markdown
    attributes:
      value: |
        **Claiming:** Ready, unassigned implementation work should be claimed in a comment and confirmed by a maintainer before substantial work begins.

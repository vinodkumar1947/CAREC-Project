name: Safety issue
description: Record a hazard or safety concern for review
title: "[SAFETY] "
labels: ["type:safety", "workstream:safety"]
body:
  - type: markdown
    attributes: {value: "Do not publish exploitable vulnerabilities, personal data, or unsafe occupied-test instructions. Use SECURITY.md for private disclosure."}
  - type: dropdown
    id: status
    attributes: {label: Status, options: [Ready, Blocked, Needs triage]}
    validations: {required: true}
  - type: dropdown
    id: complexity
    attributes: {label: Difficulty, options: [Good first issue, Beginner, Intermediate, Advanced]}
    validations: {required: true}
  - type: dropdown
    id: hardware
    attributes: {label: Hardware required, options: ["No", "Yes - owner/prototype hardware", "TBD"]}
    validations: {required: true}
  - type: textarea
    id: prerequisites
    attributes: {label: Prerequisites, description: "Setup, safety documents, decisions, skills, or previous work required. Write None if not applicable."}
    validations: {required: true}
  - type: textarea
    id: dependencies
    attributes: {label: Depends on, description: "Reference blocking issues/PRs/ADRs. Write None if unblocked."}
    validations: {required: true}
  - type: textarea
    id: hazard
    attributes: {label: Hazard / Outcome to address}
    validations: {required: true}
  - type: textarea
    id: scenario
    attributes: {label: Scenario, description: "Describe the foreseeable event sequence and operating context."}
    validations: {required: true}
  - type: input
    id: severity
    attributes: {label: Severity, placeholder: "TBD if the scale has not been approved"}
    validations: {required: true}
  - type: input
    id: probability
    attributes: {label: Probability, placeholder: "TBD if unknown"}
    validations: {required: true}
  - type: textarea
    id: consequence
    attributes: {label: Potential consequence}
    validations: {required: true}
  - type: textarea
    id: mitigation
    attributes: {label: Proposed mitigation}
    validations: {required: true}
  - type: textarea
    id: validation
    attributes: {label: Acceptance criteria / validation evidence, description: "Define safe, measurable evidence required for closure."}
    validations: {required: true}
  - type: markdown
    attributes:
      value: |
        **Claiming:** Safety work requires maintainer/owner review before substantial implementation or testing.

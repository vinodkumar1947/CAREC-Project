name: Hazard or safety concern
description: Record a non-confidential safety concern for triage
title: "safety: "
labels: ["safety", "triage"]
body:
  - type: markdown
    attributes:
      value: Do not publish exploitable vulnerabilities, personal data, or instructions for unsafe occupied testing. Use SECURITY.md when disclosure should be private.
  - type: textarea
    id: situation
    attributes:
      label: Hazardous situation and possible harm
    validations:
      required: true
  - type: textarea
    id: sequence
    attributes:
      label: Foreseeable event sequence
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or scenario
    validations:
      required: true

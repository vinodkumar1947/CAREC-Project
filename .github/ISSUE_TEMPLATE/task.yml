name: Task
description: Define a scoped engineering deliverable
title: "[TASK] "
labels: ["type:task"]
body:
  - type: textarea
    id: objective
    attributes: {label: Objective, description: "State the observable outcome."}
    validations: {required: true}
  - type: textarea
    id: background
    attributes: {label: Background}
    validations: {required: true}
  - type: textarea
    id: deliverables
    attributes: {label: Deliverables, placeholder: "- [ ] ..."}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance criteria, description: "Include exact testing instructions where possible."}
    validations: {required: true}
  - type: textarea
    id: dependencies
    attributes: {label: Dependencies}
  - type: dropdown
    id: complexity
    attributes: {label: Estimated complexity, options: [Good first issue, Beginner, Intermediate, Advanced]}
    validations: {required: true}
  - type: dropdown
    id: hardware
    attributes: {label: Required hardware, options: ["None", "Owner-only prototype", "TBD"]}
    validations: {required: true}
  - type: dropdown
    id: workstream
    attributes: {label: Workstream, options: [Architecture, Simulation, ROS2, Navigation, Vision, AI/ML, Sensor Fusion, Firmware, Hardware, Mobile, Cloud, Safety, Testing, Documentation]}
    validations: {required: true}
